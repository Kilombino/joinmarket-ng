name: Image vulnerability scanning

on:
  workflow_call:
    inputs:
      image-tags:
        description: JSON array of image tags to scan
        required: true
        type: string
      platforms:
        description: JSON array of platform name and artifact-safe slug objects
        required: true
        type: string
  schedule:
    # Re-scan the development tip and current release as advisory data changes.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      image-tags:
        description: JSON array of image tags to scan
        required: false
        default: '["main", "latest"]'
        type: string
      platforms:
        description: JSON array of platform name and slug objects
        required: false
        default: >-
          [{"name":"linux/amd64","slug":"linux-amd64"},{"name":"linux/arm64","slug":"linux-arm64"},{"name":"linux/arm/v7","slug":"linux-arm-v7"}]
        type: string

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

jobs:
  scan:
    name: ${{ matrix.image }} (${{ matrix.tag }}, ${{ matrix.platform.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - directory-server
          - directory-server-debug
          - orderbook-watcher
          - maker
          - taker
          - jmwalletd
        tag: ${{ fromJSON(inputs.image-tags || '["main", "latest"]') }}
        platform: ${{ fromJSON(inputs.platforms || '[{"name":"linux/amd64","slug":"linux-amd64"},{"name":"linux/arm64","slug":"linux-arm64"},{"name":"linux/arm/v7","slug":"linux-arm-v7"}]') }}

    steps:
      - name: Scan image and write report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ matrix.tag }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results.json
          exit-code: '0'
        env:
          TRIVY_PLATFORM: ${{ matrix.platform.name }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.tag }}-${{ matrix.image }}-${{ matrix.platform.slug }}
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize findings
        if: always()
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ matrix.tag }}
          IMAGE_PLATFORM: ${{ matrix.platform.name }}
        run: |
          if [[ ! -f trivy-results.json ]]; then
            exit 0
          fi
          total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          fixed=$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length' trivy-results.json)
          {
            echo "### ${IMAGE_NAME}:${IMAGE_TAG} (${IMAGE_PLATFORM})"
            echo
            echo "High or critical findings: ${total} (${fixed} with a published fix)"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( total > fixed )); then
            echo "::warning::${IMAGE_NAME}:${IMAGE_TAG} has $((total - fixed)) high or critical findings without a published fix; review the retained Trivy report."
          fi

      - name: Enforce vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ matrix.tag }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true
        env:
          TRIVY_PLATFORM: ${{ matrix.platform.name }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
