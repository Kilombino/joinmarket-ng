services:
  orderbook_watcher:
    build:
      context: ..
      dockerfile: orderbook_watcher/Dockerfile
    container_name: joinmarket_orderbook_watcher
    environment:
      - NETWORK_CONFIG__NETWORK=mainnet
      # XBT build: no upstream (real-Bitcoin) directories; list XBT directories here.
      - DIRECTORY_NODES=${DIRECTORY_NODES:?set DIRECTORY_NODES to XBT directory onions}
      - TOR__SOCKS_HOST=tor
      - TOR__SOCKS_PORT=9050
      - ORDERBOOK_WATCHER__MEMPOOL_API_URL=https://mempool.sgn.space/api
      - ORDERBOOK_WATCHER__HTTP_HOST=0.0.0.0
      - ORDERBOOK_WATCHER__HTTP_PORT=8000
      - ORDERBOOK_WATCHER__UPDATE_INTERVAL=60
      - LOGGING__LEVEL=INFO
    ports:
      - "8000:8000"
    networks:
      - joinmarket_orderbook_internal
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      tor:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M

  tor:
    image: ghcr.io/m0wer/docker-tor:latest
    container_name: joinmarket_orderbook_tor
    user: "1000:1000"
    volumes:
      - ./tor/conf:/etc/tor:ro
      - ./tor/data:/var/lib/tor
      - ./tor/run:/var/run/tor
    networks:
      - joinmarket_orderbook_internal
      - joinmarket_orderbook_external
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9050' 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 200M

networks:
  joinmarket_orderbook_internal:
    driver: bridge
    internal: true
  joinmarket_orderbook_external:
    driver: bridge
